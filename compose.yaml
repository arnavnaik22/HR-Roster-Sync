services:
  roster-sync:
    build: .
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      ROSTER_DB: /data/roster.db
      ROSTER_SECRET: ${ROSTER_SECRET:-development-only-secret-please-change-12345}
      ROSTER_EVENT_URL: ${ROSTER_EVENT_URL:-}
      ROSTER_MISSING_THRESHOLD: ${ROSTER_MISSING_THRESHOLD:-0.30}
      ROSTER_DEMO_MODE: "1"
      ROSTER_HOST: 0.0.0.0
    volumes:
      - roster-data:/data
volumes:
  roster-data:
